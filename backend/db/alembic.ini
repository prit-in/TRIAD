[alembic]
script_location = backend/db/migrations
prepend_sys_path = .
version_path_separator = os
# The URL comes from TRIAD_DB_URL at runtime (see migrations/env.py); this value is only a
# placeholder so alembic can start without an environment.
sqlalchemy.url = postgresql+psycopg://triad:triad_dev_pw@postgres:5432/triad

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
