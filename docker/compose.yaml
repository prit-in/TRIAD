# TRIAD MVP stack (PRD section 10.3), sized for Env-A-mini: 8 cores / ~5.3 GB in the
# Docker VM (see docs/adr/ADR-0002-env-a-mini.md). Profiles keep the resident set small:
#
#   core    postgres + mlflow + api + orchestrator + sandbox-runner + frontend  (always)
#   spark   spark-master + spark-worker                         (cluster demos, EXP-*)
#   tools   dev shell / test runner                             (on demand)
#
# Only sandbox-runner may start containers (DD-04); nothing else mounts the docker socket.
name: triad

x-triad-image: &triad-image
  image: triad-base:0.1
  build:
    context: ..
    dockerfile: docker/Dockerfile.base

x-common-env: &common-env
  TRIAD_ENV: ${TRIAD_ENV:-dev}
  TRIAD_DATA_ROOT: /data/triad
  TRIAD_DB_URL: postgresql+psycopg://triad:${POSTGRES_PASSWORD:-triad_dev_pw}@postgres:5432/triad
  TRIAD_DB_DSN: postgresql://triad:${POSTGRES_PASSWORD:-triad_dev_pw}@postgres:5432/triad
  MLFLOW_TRACKING_URI: http://mlflow:5000
  SPARK_MASTER_URL: ${SPARK_MASTER_URL:-local[2]}
  TZ: UTC
  PYTHONPATH: /workspace

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: triad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triad_dev_pw}
      POSTGRES_DB: triad
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=60
    ports: ["${TRIAD_PG_PORT:-55432}:5432"]
    volumes:
      - triad-pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triad -d triad"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {memory: 400M}
    networks: [triad-net]

  mlflow:
    <<: *triad-image
    environment:
      <<: *common-env
      # MLflow 3.x starts a job runner and seven huey consumers (~200 MB each) by default, for
      # server-side GenAI jobs TRIAD never submits; they held the container at its limit.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command:
      - bash
      - -lc
      - >-
        mlflow server --host 0.0.0.0 --port 5000 --workers 1
        --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,localhost:5500,127.0.0.1,127.0.0.1:5000,127.0.0.1:5500
        --backend-store-uri postgresql+psycopg://triad:${POSTGRES_PASSWORD:-triad_dev_pw}@postgres:5432/mlflow
        --default-artifact-root /data/triad/mlartifacts
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["${TRIAD_MLFLOW_PORT:-5500}:5000"]
    volumes:
      - triad-data:/data/triad
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits: {memory: 1200M}
    networks: [triad-net]

  api:
    <<: *triad-image
    environment:
      <<: *common-env
      TRIAD_JWT_SECRET: ${TRIAD_JWT_SECRET:-dev-only-insecure-secret-change-me-before-any-real-deployment}
    # --reload because this compose file is the local development stack and mounts the
    # source; without it a container quietly serves the code it started with, which is how
    # two fixes were "verified" against a container that did not have them.
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--reload", "--reload-dir", "/workspace/backend", "--reload-dir", "/workspace/triad_core",
              "--reload-dir", "/workspace/agents"]
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["${TRIAD_API_PORT:-8010}:8000"]
    volumes:
      - ..:/workspace
      - triad-data:/data/triad
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: {memory: 700M}
    networks: [triad-net]

  orchestrator:
    <<: *triad-image
    environment:
      <<: *common-env
      TRIAD_WORKER_NAME: orchestrator-1
      # Gate 5 runs sbt and a forked ScalaTest JVM at once, beside the worker: two JVMs whose
      # default heaps (sbt's 1 GB, the suite's 1500m) alone exceeded the old 1600M limit.
      # The caches live on the volumes mounted below. The process runs as root, whose home is
      # /root, so without these sbt and coursier used /root inside the container and fetched
      # sbt and every dependency again after each container start (DEC-43).
      SBT_OPTS: "-Xmx800m -Xss4m -Dsbt.boot.directory=/home/triad/.sbt/boot -Dsbt.global.base=/home/triad/.sbt/1.0 -Dsbt.ivy.home=/home/triad/.ivy2"
      COURSIER_CACHE: /home/triad/.cache/coursier
      TRIAD_TEST_HEAP: "700m"
      # Generated code runs in containers started by sandbox-runner; without these two the
      # worker falls back to LocalRunner and every result says isolation was not in force.
      TRIAD_SANDBOX_URL: http://sandbox-runner:8090
      TRIAD_SANDBOX_TOKEN: ${TRIAD_SANDBOX_TOKEN:-dev-only-sandbox-token-change-me}
    command: ["python", "-m", "agents.worker"]
    depends_on:
      postgres: {condition: service_healthy}
      sandbox-runner: {condition: service_healthy}
    volumes:
      - ..:/workspace
      - triad-data:/data/triad
      - triad-ivy:/home/triad/.ivy2
      - triad-sbt:/home/triad/.sbt
      - triad-coursier:/home/triad/.cache/coursier
    deploy:
      resources:
        limits: {memory: 2600M}
    networks: [triad-net]

  # The only service with the docker socket (DD-04, PRD 22.3). It holds no database URL, no
  # JWT secret and no LLM key: just the socket, the token its one caller presents, and the
  # same data and source mounts, read so it can hand a job exactly the paths it was given.
  # The jobs it starts run with no network, so they cannot reach this service either.
  sandbox-runner:
    <<: *triad-image
    environment:
      TZ: UTC
      PYTHONPATH: /workspace
      TRIAD_DATA_ROOT: /data/triad
      TRIAD_SANDBOX_TOKEN: ${TRIAD_SANDBOX_TOKEN:-dev-only-sandbox-token-change-me}
      TRIAD_SANDBOX_IMAGES: triad-base:0.1
    command: ["python", "-m", "sandbox.service", "--port", "8090"]
    volumes:
      - ..:/workspace:ro
      - triad-data:/data/triad
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8090/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits: {memory: 200M}
    networks: [triad-net]

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: ["sh", "-lc", "npm ci --no-audit --no-fund || npm install --no-audit --no-fund; npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8010/api/v1}
    ports: ["${TRIAD_WEB_PORT:-5173}:5173"]
    volumes:
      - ../frontend:/app
      - triad-node-modules:/app/node_modules
    deploy:
      resources:
        limits: {memory: 700M}
    networks: [triad-net]

  spark-master:
    <<: *triad-image
    profiles: ["spark"]
    # The sandbox's user (SANDBOX_USER, 1000): a cluster job's driver runs in a sandbox container
    # as that user and commits the files its executors wrote, which it cannot rename out of
    # folders an executor running as root created.
    user: "1000:1000"
    command: ["bash", "-c", "$$SPARK_HOME/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080"]
    environment:
      <<: *common-env
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "${TRIAD_SPARK_UI_PORT:-8090}:8080"
      - "7077:7077"
    volumes:
      - triad-data:/data/triad
    deploy:
      resources:
        limits: {memory: 700M}
    networks: [triad-net, triad-sandbox-net]

  spark-worker:
    <<: *triad-image
    profiles: ["spark"]
    user: "1000:1000"
    command: ["bash", "-c", "$$SPARK_HOME/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores ${SPARK_WORKER_CORES:-2} --memory ${SPARK_WORKER_MEMORY:-1800m} --webui-port 8081"]
    environment:
      <<: *common-env
      SPARK_NO_DAEMONIZE: "true"
    depends_on: [spark-master]
    volumes:
      - triad-data:/data/triad
    deploy:
      resources:
        limits: {memory: 2400M}
    networks: [triad-net, triad-sandbox-net]

  dev:
    <<: *triad-image
    profiles: ["tools"]
    environment:
      <<: *common-env
      TRIAD_DB_URL: postgresql+psycopg://triad:${POSTGRES_PASSWORD:-triad_dev_pw}@postgres:5432/triad
      # The orchestrator's JVM heaps (DEC-23), so experiments run gates 4 and 5 as production
      # does. Without them sbt took its 1 GB default and the forked test JVM 1500m, about a
      # gigabyte more than production beside a Spark job, and the VM ran out under EXP-5 (DEC-42).
      # ...and its caches on the mounted volumes: every fresh experiment container otherwise
      # downloaded sbt and 386 MB of dependencies inside its first compile (DEC-43).
      SBT_OPTS: "-Xmx800m -Xss4m -Dsbt.boot.directory=/home/triad/.sbt/boot -Dsbt.global.base=/home/triad/.sbt/1.0 -Dsbt.ivy.home=/home/triad/.ivy2"
      COURSIER_CACHE: /home/triad/.cache/coursier
      TRIAD_TEST_HEAP: "700m"
      # Experiments and tests take the production path: jobs run in sandbox-runner's containers.
      TRIAD_SANDBOX_URL: http://sandbox-runner:8090
      TRIAD_SANDBOX_TOKEN: ${TRIAD_SANDBOX_TOKEN:-dev-only-sandbox-token-change-me}
    command: ["sleep", "infinity"]
    volumes:
      - ..:/workspace
      - triad-data:/data/triad
      - triad-ivy:/home/triad/.ivy2
      - triad-sbt:/home/triad/.sbt
      - triad-coursier:/home/triad/.cache/coursier
    deploy:
      resources:
        limits: {memory: 3000M}
    # No swap beyond the limit (DEC-35): experiments that measure where memory runs out need the
    # limit to be where it runs out, not the start of a slow slide through the VM's shared swap.
    memswap_limit: 3000M
    networks: [triad-net, triad-sandbox-net]

networks:
  triad-net:
    driver: bridge
  # Sandbox jobs reach only Spark and storage: no route off the host (PRD section 22.2).
  triad-sandbox-net:
    driver: bridge
    internal: true

volumes:
  triad-pgdata:
  triad-data:
  triad-ivy:
  triad-sbt:
  triad-coursier:
  triad-node-modules:
